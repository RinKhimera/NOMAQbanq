version: 2
updates:
  # Dépendances npm — écosystème "bun" pour que Dependabot régénère bun.lock
  # (avec "npm" il ne touche que package.json → le CI échoue sur --frozen-lockfile)
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Montreal"
    open-pull-requests-limit: 5
    # Laisser retomber les publications fraîches : une release cassée est
    # généralement corrigée en quelques jours, avant d'entrer dans une PR.
    cooldown:
      default-days: 3
      semver-major-days: 7
    # Ordre = priorité : une dépendance va dans le PREMIER groupe qui la capture.
    groups:
      # Le linter et les types React doivent monter EN MÊME TEMPS que le
      # framework : décalés, ils appliquent les règles d'une version de Next
      # qui n'est pas celle installée.
      nextjs:
        patterns:
          - "next"
          - "react"
          - "react-dom"
          - "eslint-config-next"
          - "@next/*"
          - "@types/react"
          - "@types/react-dom"
      # Outillage sans effet sur le bundle livré : candidat à l'auto-merge
      # (cf. .github/workflows/dependabot-auto-merge.yml).
      tooling:
        patterns:
          - "eslint"
          - "@eslint/*"
          - "eslint-plugin-*"
          - "eslint-config-*"
          - "prettier"
          - "prettier-plugin-*"
          - "@trivago/prettier-plugin-*"
          - "typescript"
          - "@types/*"
          - "vitest"
          - "@vitest/*"
          - "@vitejs/*"
          - "vite"
          - "happy-dom"
          - "@testing-library/*"
          - "playwright"
          - "@playwright/*"
        update-types:
          - "minor"
          - "patch"
      # better-auth valide le schéma Drizzle au démarrage : un écart rejette
      # toutes les requêtes, getSession compris. PR isolée pour que l'échec du
      # test d'intégration d'inscription réelle désigne la cause sans ambiguïté.
      better-auth:
        patterns:
          - "better-auth"
        update-types:
          - "patch"
      # Tout ce qui part en production, en minor + patch : relecture humaine.
      runtime:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
      # Tout le reste en major : 1 seule PR groupée (breaking, à reviewer ensemble)
      major:
        patterns:
          - "*"
        update-types:
          - "major"
    ignore:
      # Les types doivent suivre le runtime Node (Vercel/CI = Node 24 LTS)
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # Retirer quand eslint-config-next supportera ESLint 10
      # (eslint-plugin-react crashe : context.getFilename() supprimé)
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # plugin-react 6 importe vite/internal, absent de Vite 7. Vitest ne fournit
      # pas Vite : la version est celle de notre devDependency `vite`. Retirer en
      # montant `vite` en 8 dans la même PR.
      - dependency-name: "@vitejs/plugin-react"
        update-types: ["version-update:semver-major"]
      # Les mineures de better-auth ajoutent des fonctionnalités et des
      # options : montée à la main. L'amont s'engage à ne plus toucher au
      # schéma de base pendant la v1 (better-auth/better-auth#11153), d'où les
      # patchs laissés au groupe dédié. Les alertes de sécurité GitHub ne
      # dépendent pas de ce fichier et continuent de signaler une faille.
      - dependency-name: "better-auth"
        update-types: ["version-update:semver-minor"]
      # Le SDK AWS publie quasi quotidiennement ; ses patchs n'apportent rien
      # aux trois clients utilisés ici (S3, SESv2, presigned POST).
      - dependency-name: "@aws-sdk/*"
        update-types: ["version-update:semver-patch"]
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    # Toutes les actions dans une seule PR groupée au lieu d'une PR par action
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un nouveau push sur une branche annule le run CI obsolète encore en cours.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege : le job ne fait que lire le repo.
permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      # Garde-fou rapide, sans secret : seuil à 80 % sur le périmètre frontend.
      # La couverture AGRÉGÉE (frontend + backend) est mesurée par le job
      # `integration`, qui seul dispose de la branche Neon.
      - name: Tests with coverage
        run: bun run test:coverage

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Orchestrateur : crée une branche Neon jetable (test-*), migre, lance le
      # projet vitest `integration`, détruit la branche. Seuls secrets requis :
      # NEON_API_KEY + NEON_PROJECT_ID (l'URL DB vient de la branche créée ;
      # l'env applicatif vient de tests/helpers/test-env.ts).
      # Lance les DEUX projets sur la branche jetable et applique les seuils de
      # `vitest.coverage.config.ts` : c'est la seule mesure qui voie le backend
      # (`features/**`, `app/api/**`), invisible du périmètre frontend.
      - name: Integration tests + aggregated coverage (ephemeral Neon branch)
        run: bun run test:coverage:full
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
          NEON_PROJECT_ID: ${{ secrets.NEON_PROJECT_ID }}

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # `labeled`/`unlabeled` : poser ou retirer `skip-integration` relance la CI.
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Un nouveau push sur une branche annule le run CI obsolète encore en cours.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege : le job ne fait que lire le repo.
permissions:
  contents: read

jobs:
  quality:
    name: Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run type-check

      - name: Lint
        run: bun run lint

      - name: Format check
        run: bun run format:check

      # Garde-fou rapide, sans secret : seuil à 80 % sur le périmètre frontend.
      # La couverture AGRÉGÉE (frontend + backend) est mesurée par le job
      # `integration`, qui seul dispose d'une base de données.
      - name: Tests with coverage
        run: bun run test:coverage

  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    # Label `skip-integration` sur la PR : job sauté. Un job sauté par `if`
    # rend « Success », donc le check requis du ruleset reste satisfait.
    # Toujours exécuté sur un push vers main.
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'skip-integration') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Cache Bun install
        uses: actions/cache@v6
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Orchestrateur : démarre un Postgres jetable (`docker run postgres:18`,
      # Docker est fourni par le runner), migre une base vide, lance les projets
      # vitest, supprime le conteneur. Aucun secret. La base tourne sur le
      # runner lui-même : la latence ne dépend pas de la région Azure qui
      # l'héberge.
      # Lance aussi le projet frontend et applique les seuils de
      # `vitest.coverage.config.ts` : c'est la seule mesure qui voie le backend
      # (`features/**`, `app/api/**`), invisible du périmètre frontend.
      - name: Integration tests + aggregated coverage (Postgres container)
        run: bun run test:coverage:full
